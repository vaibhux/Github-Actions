name: Hello

# Runs on a trigger
on:
  push:
    branches: [main]

# Jobs inside the workflow
jobs:

  # Name of the job
  greet:
    # GitHub runner
    runs-on: ubuntu-latest

    steps:
      - name: Say hello to users
        run: echo "Hello world, this is Vaibhavi"

      - name: Say hello to username
        run: echo "Hello $USER"
