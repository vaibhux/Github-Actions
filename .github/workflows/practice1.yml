# This is the workflow
name: Hello

# Runs on a trigger
on:
  workflow_dispatch: 
# Jobs inside the workflow
jobs:

  # This is the name of the job
  greet:
    # GitHub runner
    runs-on: ubuntu-latest

    steps:
      - name: say hello to users
        run: echo "Hello world This is vaibhavi"

      - name: say hello to username
        run: echo "Hello $USER"

  details:
    runs-on: ubuntu-latest
    steps:
      - name: version of pyton, docket, etc
        run: docker --version && python --version
  
